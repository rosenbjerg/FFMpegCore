name: CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - Directory.Build.props
      - FFMpegCore/**
      - FFMpegCore.Test/**
      - FFMpegCore.Extensions.SkiaSharp/**
      - FFMpegCore.Extensions.System.Drawing.Common/**
      - FFMpegCore.Extensions.Downloader/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - Directory.Build.props
      - FFMpegCore/**
      - FFMpegCore.Test/**
      - FFMpegCore.Extensions.SkiaSharp/**
      - FFMpegCore.Extensions.System.Drawing.Common/**
      - FFMpegCore.Extensions.Downloader/**

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    timeout-minutes: 7
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - if: matrix.os == 'ubuntu-latest'
        name: Lint with dotnet
        run: dotnet format FFMpegCore.sln --severity warn --verify-no-changes

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # 1.2.5
        with:
          version: ${{ matrix.os != 'macos-latest' && '8.1' || '81' }}
          token: ${{ github.token }}

      - name: Test with dotnet
        run: dotnet test FFMpegCore.sln  --collect "XPlat Code Coverage" --logger GitHubActions

      - if: matrix.os == 'windows-latest'
        name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          directory: FFMpegCore.Test/TestResults
          token: ${{ secrets.CODECOV_TOKEN }}
          os: windows

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      unpublished: ${{ steps.resolve.outputs.unpublished }}
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find package versions not yet on nuget.org
        id: resolve
        shell: bash
        run: |
          unpublished='[]'
          for project in */*.csproj; do
            props=$(dotnet msbuild "$project" -getProperty:IsPackable,PackageId,PackageVersion | jq -c .Properties)
            [ "$(jq -r .IsPackable <<< "$props")" = true ] || continue
            id=$(jq -r .PackageId <<< "$props")
            version=$(jq -r .PackageVersion <<< "$props")
            status=$(curl -s -o "$RUNNER_TEMP/index.json" -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/${id,,}/index.json")
            case $status in
              200) published=$(jq -r --arg v "$version" '.versions | index($v) != null' "$RUNNER_TEMP/index.json") ;;
              404) published=false ;;
              *) echo "::error::nuget.org returned HTTP $status for $id"; exit 1 ;;
            esac
            echo "$id $version published=$published"
            [ "$published" = false ] || continue
            tag_prefix=v
            [ "$id" = FFMpegCore ] || tag_prefix="$id/v"
            unpublished=$(jq -c --arg id "$id" --arg project "$project" --arg version "$version" --arg tag_prefix "$tag_prefix" \
              '. + [{ id: $id, project: $project, version: $version, tag_prefix: $tag_prefix }]' <<< "$unpublished")
          done
          echo "unpublished=$unpublished" >> "$GITHUB_OUTPUT"

  release:
    needs: [ci, version]
    if: needs.version.outputs.unpublished != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.version.outputs.unpublished) }}
    concurrency: release-${{ matrix.id }}
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ matrix.tag_prefix }}${{ matrix.version }}
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate release notes
        shell: bash
        env:
          TAG_PREFIX: ${{ matrix.tag_prefix }}
        run: |
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          previous=$(git ls-remote --tags --refs origin "$TAG_PREFIX*" | sed 's|.*refs/tags/||' | sort -V | tail -1)
          [ -z "$previous" ] || args+=(-f previous_tag_name="$previous")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Pack
        run: dotnet pack ${{ matrix.project }} -c Release -p:PackageReleaseNotesFile=$RUNNER_TEMP/notes.md

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: rosenbjergsoftworks

      - name: Publish NuGet package
        run: dotnet nuget push nupkg/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: Create GitHub release
        run: gh release create "$TAG" nupkg/*.nupkg --target "$GITHUB_SHA" --title "${{ matrix.id }} ${{ matrix.version }}" --notes-file "$RUNNER_TEMP/notes.md" --latest=${{ matrix.id == 'FFMpegCore' }}
